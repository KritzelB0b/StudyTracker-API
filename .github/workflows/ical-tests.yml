name: iCal validation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  calendar-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m compileall -q main.py ical_subscription.py
      - run: python -m unittest discover -s tests -v
      - name: Build the exact Railway Dockerfile
        run: docker build --progress=plain -t studytracker-api:ci .
      - name: Validate final container dependencies and timezones
        run: |
          docker run --rm studytracker-api:ci python -m pip check
          docker run --rm studytracker-api:ci python -m compileall -q main.py ical_subscription.py
          docker run --rm studytracker-api:ci python -c 'from zoneinfo import ZoneInfo; assert ZoneInfo("Europe/Berlin")'
      - name: Report final image size
        run: docker image inspect studytracker-api:ci --format 'Image size in bytes: {{.Size}}'
